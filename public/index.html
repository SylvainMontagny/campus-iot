<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172420">
    <title>Campus IoT</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <a class="brand" href="/" aria-label="Campus IoT Platform home">
          <span><strong>Campus IoT Platform</strong><small id="app-version"></small></span>
        </a>
        <span id="mqtt-state" class="connection-state"><span class="state-dot state-dot-offline"></span>MQTT offline</span>
      </div>
      <button id="live-logs-button" class="button button-live-logs" type="button" data-select-view="log">Live logs</button>
      <div class="topbar-right">
        <button id="import-button" class="button button-quiet" type="button">Import CONF</button>
        <button id="export-button" class="button button-quiet" type="button">Export CONF</button>
        <button id="edit-json-button" class="button button-quiet" type="button">Edit CONF</button>
        <button id="save-button" class="button button-primary" type="button">Save</button>
        <input id="import-file" type="file" accept="application/json,.json,application/zip,.zip" multiple hidden>
      </div>
    </header>

    <main class="workspace">
      <aside class="rail" aria-label="Configuration navigation">
        <div class="rail-group">
          <button class="rail-title rail-title-mqtt" type="button" data-select-view="mqtt">
            MQTT connection
            <span id="mqtt-nav-dot" class="nav-status-dot" aria-hidden="true"></span>
          </button>
        </div>
        <div class="rail-group">
          <button class="rail-title rail-title-bms" type="button" data-select-view="bms-home">BMS connections</button>
          <nav id="connection-navigation" class="device-navigation" aria-label="BMS connections"></nav>
        </div>
        <div class="rail-group">
          <button class="rail-title rail-title-lorawan" type="button" data-select-view="devices-home">LoRaWAN to BACnet</button>
          <nav id="device-navigation" class="device-navigation" aria-label="Device profiles"></nav>
        </div>
        <div class="rail-group">
          <button class="rail-title rail-title-zones" type="button" data-select-view="schedule-global">Zones &amp; Schedules</button>
          <nav id="zone-navigation" class="device-navigation" aria-label="Zones"></nav>
          <button class="add-device-button" type="button" data-action="add-zone"><span aria-hidden="true">+</span> Add zone</button>
        </div>
      </aside>

      <section class="content">
        <div class="page-heading">
          <div>
            <h1 id="page-title">BMS connections</h1>
            <p id="page-description"></p>
          </div>
        </div>

        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <div id="notice-warning" class="notice notice-warning" role="status" aria-live="polite" hidden></div>
        <section id="category-page" class="config-section category-page" aria-live="polite" hidden></section>
        <section class="config-section global-section" aria-labelledby="global-title">
          <div class="section-heading">
            <div><h2 id="global-title">BMS connections</h2></div>
            <button class="button button-danger-quiet" type="button" data-action="delete-connection">Remove</button>
          </div>
          <label class="field profile-name-field"><span>Connection name</span><input id="connection-name" type="text" autocomplete="off"></label>
          <div id="global-form" class="field-grid"></div>
        </section>
        <section id="bms-objects-section" class="config-section bms-objects" aria-live="polite" hidden></section>

        <section id="device-editor" class="config-section device-section" aria-live="polite" hidden></section>
        <section id="schedule-global-editor" aria-live="polite" hidden></section>
        <section id="zone-editor" class="config-section device-section" aria-live="polite" hidden></section>

        <section id="mqtt-section" class="config-section mqtt-section" aria-labelledby="mqtt-title" hidden>
          <div class="section-heading">
            <div><h2 id="mqtt-title">MQTT broker</h2></div>
            <span id="mqtt-section-state" class="mqtt-section-state is-disconnected">Disconnected</span>
          </div>
          <div class="field-grid mqtt-fields">
            <div class="field-row">
              <label class="field"><span>LoRaWAN Network server</span>
                <select id="mqtt-networkServer">
                  <option value="ttn" selected>The Things Stack (TTN)</option>
                  <option value="tts">The Things Stack (TTS)</option>
                  <option value="chirpstack">ChirpStack</option>
                  <option value="actility">Actility</option>
                </select>
              </label>
            </div>
            <div class="field-pair">
              <label class="field"><span>Server</span><input id="mqtt-server" type="text" placeholder="broker.example.org" autocomplete="url"></label>
              <label class="field"><span>Port</span><input id="mqtt-port" type="number" min="1" max="65535" value="1883" inputmode="numeric"></label>
            </div>
            <div class="field-pair">
              <label class="field"><span>Login</span><input id="mqtt-username" type="text" autocomplete="username"></label>
              <label class="field"><span>Password</span><input id="mqtt-password" type="password" autocomplete="current-password"></label>
            </div>
            <div class="field-row">
              <label class="field"><span>Topic</span><input id="mqtt-topic" type="text" placeholder="#" autocomplete="off"></label>
            </div>
            <div id="mqtt-chirpstack-fields" class="field-grid" hidden>
              <div class="field-row">
                <label class="field"><span>gRPC API key</span><input id="mqtt-grpcApiKey" type="password" autocomplete="off"></label>
              </div>
              <div class="field-pair">
                <label class="field"><span>Server address</span><input id="mqtt-serverAddress" type="text" autocomplete="off"></label>
                <label class="field"><span>gRPC port</span><input id="mqtt-grpcPort" type="number" min="1" max="65535" value="8080" inputmode="numeric"></label>
              </div>
            </div>
          </div>
          <div class="mqtt-actions">
            <button id="mqtt-connect-button" class="button button-primary" type="button">Connect &amp; Save</button>
            <button id="mqtt-disconnect-button" class="button button-outline" type="button" disabled>Disconnect</button>
            <label class="mqtt-auto"><input id="mqtt-auto-connect" type="checkbox"> Auto connect on startup</label>
          </div>
          <section class="mqtt-log-section" aria-labelledby="mqtt-raw-title">
            <div class="mqtt-log-heading"><div><h3 id="mqtt-raw-title">MQTT messages</h3></div><span class="mqtt-log-tools"><span id="mqtt-raw-count" class="mqtt-log-count">0 entries</span><button class="button button-outline" type="button" data-toggle-log="raw">Suspend</button><button class="button button-outline" type="button" data-clear-log="mqtt-raw-log">Clear logs</button></span></div>
            <div id="mqtt-raw-log" class="mqtt-log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </section>
        </section>

        <section id="log-section" class="config-section mqtt-section" aria-labelledby="log-title" hidden>

          <section class="mqtt-log-section" aria-labelledby="mqtt-log-title">
            <div class="mqtt-log-heading"><div></div><span class="mqtt-log-tools"><span id="mqtt-log-count" class="mqtt-log-count">0 entries</span><button class="button button-outline" type="button" data-toggle-log="log">Suspend</button><button class="button button-outline" type="button" data-clear-log="mqtt-log">Clear logs</button></span></div>
            <div id="mqtt-log" class="mqtt-log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </section>
        </section>
      </section>
    </main>

    <dialog id="json-dialog" class="json-dialog">
      <form method="dialog" class="dialog-form">
        <div class="dialog-heading"><div><h2>Edit device profiles configuration file</h2></div><button class="icon-button" value="cancel" aria-label="Close dialog">×</button></div>
        <p class="dialog-copy">Changes are checked before they are applied</p>
        <textarea id="json-input" class="code-input json-editor" spellcheck="false" aria-label="Device profiles JSON"></textarea>
        <div id="json-errors" class="inline-error" hidden></div>
        <div class="dialog-actions"><button class="button button-outline" value="cancel">Cancel</button><button id="apply-json-button" class="button button-primary" type="button">Apply JSON</button></div>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
