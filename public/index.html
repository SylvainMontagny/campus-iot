<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#172420">
    <title>Campus IoT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Campus IoT Platform home">
        <span><strong>Campus IoT Platform</strong><small id="app-version"></small></span>
      </a>
      <div class="topbar-right">
        <span id="mqtt-state" class="connection-state"><span class="state-dot state-dot-offline"></span>MQTT offline</span>
        <button id="import-button" class="button button-quiet" type="button">Import JSON</button>
        <button id="export-button" class="button button-quiet" type="button">Export JSON</button>
        <button id="edit-json-button" class="button button-quiet" type="button">Edit JSON</button>
        <button id="save-button" class="button button-primary" type="button">Save configuration</button>
        <input id="import-file" type="file" accept="application/json,.json" multiple hidden>
      </div>
    </header>

    <main class="workspace">
      <aside class="rail" aria-label="Configuration navigation">
        <div class="rail-group">
          <button class="device-nav-item mqtt-nav-item" type="button" data-select-view="mqtt">
            <span class="device-nav-copy"><strong>MQTT connection</strong><small id="mqtt-nav-status">Disconnected</small></span>
            <span id="mqtt-nav-dot" class="nav-status-dot" aria-hidden="true"></span>
          </button>
        </div>
        <div class="rail-group">
          <button class="device-nav-item global-nav-item is-selected" type="button" data-select-view="global">
            <span class="device-nav-copy"><strong>BMS connections</strong><small id="connection-count">0 named profiles</small></span>
            <span class="nav-chevron" aria-hidden="true">›</span>
          </button>
          <nav id="connection-navigation" class="device-navigation profile-navigation" aria-label="Global connection profiles"></nav>
          <button class="add-device-button add-profile-button" type="button" data-action="add-connection"><span aria-hidden="true">+</span> Add connection</button>
        </div>
        <div class="rail-group">
          <div class="rail-title">LoRaWAN to BACnet</div>
          <nav id="device-navigation" class="device-navigation" aria-label="Device types"></nav>
          <button id="add-device-button" class="add-device-button" type="button" data-action="add-device"><span aria-hidden="true">+</span> Add device type</button>
        </div>
        <div class="rail-group">
          <div class="rail-title">Rooms &amp; Schedules</div>
          <button class="device-nav-item global-nav-item" type="button" data-select-view="schedule-global">
            <span class="device-nav-copy"><strong>Global configuration</strong><small>Updates and default settings</small></span>
            <span class="nav-chevron" aria-hidden="true">›</span>
          </button>
          <nav id="room-navigation" class="device-navigation" aria-label="Rooms"></nav>
          <button class="add-device-button" type="button" data-action="add-room"><span aria-hidden="true">+</span> Add room</button>
        </div>
        <div class="rail-group">
          <button class="device-nav-item mqtt-nav-item" type="button" data-select-view="log">
            <span class="device-nav-copy"><strong>Message log</strong><small>Incoming packets</small></span>
          </button>
        </div>
      </aside>

      <section class="content">
        <div class="page-heading">
          <div>
            <h1 id="page-title">BMS connections</h1>
            <p id="page-description"></p>
          </div>
        </div>

        <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
        <section class="config-section global-section" aria-labelledby="global-title">
          <div class="section-heading">
            <div><h2 id="global-title">BMS connection</h2></div>
            <button class="button button-danger-quiet" type="button" data-action="delete-connection">Remove profile</button>
          </div>
          <label class="field profile-name-field"><span>Connection name</span><input id="connection-name" type="text" autocomplete="off"></label>
          <div id="global-form" class="field-grid"></div>
        </section>

        <section id="device-editor" class="config-section device-section" aria-live="polite" hidden></section>
        <section id="schedule-global-editor" class="config-section schedule-section" aria-live="polite" hidden></section>
        <section id="room-editor" class="config-section device-section" aria-live="polite" hidden></section>

        <section id="mqtt-section" class="config-section mqtt-section" aria-labelledby="mqtt-title" hidden>
          <div class="section-heading">
            <div><h2 id="mqtt-title">MQTT broker</h2></div>
            <span id="mqtt-section-state" class="mqtt-section-state">Disconnected</span>
          </div>
          <div class="field-grid mqtt-fields">
            <div class="field-pair">
              <label class="field"><span>Server</span><input id="mqtt-server" type="text" placeholder="broker.example.org" autocomplete="url"></label>
              <label class="field"><span>Port</span><input id="mqtt-port" type="number" min="1" max="65535" value="1883" inputmode="numeric"></label>
            </div>
            <div class="field-pair">
              <label class="field"><span>Login</span><input id="mqtt-username" type="text" autocomplete="username"></label>
              <label class="field"><span>Password</span><input id="mqtt-password" type="password" autocomplete="current-password"></label>
            </div>
            <div class="field-row">
              <label class="field"><span>Topic</span><input id="mqtt-topic" type="text" placeholder="#" autocomplete="off"></label>
            </div>
          </div>
          <div class="mqtt-actions">
            <button id="mqtt-connect-button" class="button button-primary" type="button">Connect &amp; Save</button>
            <button id="mqtt-disconnect-button" class="button button-outline" type="button" disabled>Disconnect</button>
            <label class="mqtt-auto"><input id="mqtt-auto-connect" type="checkbox"> Auto connect on startup</label>
          </div>
          <section class="mqtt-log-section" aria-labelledby="mqtt-raw-title">
            <div class="mqtt-log-heading"><div><h3 id="mqtt-raw-title">Raw messages</h3></div><span class="mqtt-log-tools"><span id="mqtt-raw-count" class="mqtt-log-count">0 entries</span><button class="button button-outline" type="button" data-toggle-log="raw">Suspend</button><button class="button button-outline" type="button" data-clear-log="mqtt-raw-log">Clear logs</button></span></div>
            <div id="mqtt-raw-log" class="mqtt-log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </section>
        </section>

        <section id="log-section" class="config-section mqtt-section" aria-labelledby="log-title" hidden>
          <div class="section-heading">
            <div><h2 id="log-title">Incoming packets</h2></div>
          </div>
          <section class="mqtt-log-section" aria-labelledby="mqtt-log-title">
            <div class="mqtt-log-heading"><div><span class="eyebrow">LIVE ACTIVITY</span><h3 id="mqtt-log-title">Message log</h3></div><span class="mqtt-log-tools"><span id="mqtt-log-count" class="mqtt-log-count">0 entries</span><button class="button button-outline" type="button" data-toggle-log="log">Suspend</button><button class="button button-outline" type="button" data-clear-log="mqtt-log">Clear logs</button></span></div>
            <div id="mqtt-log" class="mqtt-log" role="log" aria-live="polite" aria-relevant="additions"></div>
          </section>
        </section>
      </section>
    </main>

    <dialog id="json-dialog" class="json-dialog">
      <form method="dialog" class="dialog-form">
        <div class="dialog-heading"><div><h2>Edit device list configuration file</h2></div><button class="icon-button" value="cancel" aria-label="Close dialog">×</button></div>
        <p class="dialog-copy">Changes are checked before they are applied</p>
        <textarea id="json-input" class="code-input json-editor" spellcheck="false" aria-label="Device list JSON"></textarea>
        <div id="json-errors" class="inline-error" hidden></div>
        <div class="dialog-actions"><button class="button button-outline" value="cancel">Cancel</button><button id="apply-json-button" class="button button-primary" type="button">Apply JSON</button></div>
      </form>
    </dialog>

    <script src="/app.js" defer></script>
  </body>
</html>
